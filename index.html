
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Logika Matematika SD</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dbeafe, #fef3c7);
  color: #243047;
}

.card {
  max-width: 680px;
  margin: 20px auto;
  padding: 26px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 8px 28px #33415520;
}

h1 { font-size: 27px; margin-top: 0; }
h2 { line-height: 1.5; font-size: 23px; }
.muted { color: #64748b; line-height: 1.6; }

input {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0 16px;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  font-size: 16px;
}

button {
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled { opacity: .55; cursor: not-allowed; }

.primary {
  background: #2563eb;
  color: white;
  font-weight: bold;
}

.full { width: 100%; }

.choice {
  width: 100%;
  display: block;
  margin: 10px 0;
  text-align: left;
  background: #f8fafc;
  border: 2px solid #e2e8f0;
  color: #243047;
  line-height: 1.5;
}

.choice.selected {
  border-color: #2563eb;
  background: #dbeafe;
}

.progress {
  height: 9px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
  margin: 16px 0 24px;
}

.bar {
  height: 100%;
  width: 0;
  background: #2563eb;
  transition: width .2s;
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.center { text-align: center; }
.hidden { display: none; }
.error { color: #dc2626; }
.score { font-size: 52px; font-weight: bold; color: #2563eb; }
.emoji { font-size: 45px; margin: 12px 0; }
.notice { background: #eff6ff; padding: 12px; border-radius: 12px; }

@media (max-width: 500px) {
  .card { padding: 20px; margin: 8px auto; }
  h1 { font-size: 24px; }
  h2 { font-size: 20px; }
}
</style>
</head>

<body>

<div class="card" id="start">
  <div class="emoji">🧠🔢</div>
  <h1>Kuis Logika Matematika</h1>
  <p class="muted">Untuk anak SD kelas 1–2</p>

  <div class="notice">
    ⭐ 20 soal pilihan ganda<br>
    🌈 Setiap jawaban benar mendapat 5 poin<br>
    🏆 Nilai tertinggi 100
  </div>

  <p><b>Siapa namamu?</b></p>
  <input id="name" maxlength="100" placeholder="Tulis nama di sini">

  <p id="startError" class="error"></p>
  <button class="primary full" onclick="startQuiz()">Ayo Mulai! 🚀</button>
</div>

<div class="card hidden" id="quiz">
  <div class="top">
    <b id="number"></b>
    <b id="points">0 poin</b>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="emoji" id="picture"></div>
  <h2 id="question"></h2>
  <div id="choices"></div>

  <p class="muted" id="hint">Pilih satu jawaban yang benar, ya!</p>
  <button class="primary full" id="next" disabled onclick="nextQuestion()">Lanjut ➜</button>
</div>

<div class="card center hidden" id="result">
  <div class="emoji" id="resultEmoji">🎉</div>
  <h1>Hebat! Kuis Selesai!</h1>
  <p id="resultName"></p>
  <div class="score" id="score"></div>
  <p id="message"></p>
  <p id="detail" class="muted"></p>
  <p id="saveStatus" class="muted"></p>
  <button class="primary full" id="retry" onclick="restart()">Main Lagi 🔄</button>
</div>

<script>
const FORMSPREE_URL = "https://formspree.io/f/xeaerobg";

const questions = [
  {
    q: "Angka apa yang tepat untuk melanjutkan pola ini?",
    pic: "🔢  1, 2, 3, 4, ...",
    options: ["5", "7", "2", "9"],
    answer: 0
  },
  {
    q: "Ada 🍎🍎🍎. Ibu memberi 2 apel lagi. Berapa jumlah apel sekarang?",
    pic: "🍎 🍎 🍎 + 🍎 🍎",
    options: ["4 apel", "6 apel", "5 apel", "3 apel"],
    answer: 2
  },
  {
    q: "Pola warna ini berulang. Lingkaran apa yang berikutnya?",
    pic: "🔴 🔵 🔴 🔵 🔴 ...",
    options: ["🟢", "🔴", "🟡", "🔵"],
    answer: 3
  },
  {
    q: "Budi punya 7 permen. Ia memberikan 3 permen kepada adiknya. Berapa sisa permen Budi?",
    pic: "🍬 🍬 🍬 🍬 🍬 🍬 🍬",
    options: ["5", "3", "4", "10"],
    answer: 2
  },
  {
    q: "Hewan mana yang memiliki jumlah kaki lebih banyak?",
    pic: "🐱 atau 🐔",
    options: ["Kucing, 4 kaki", "Ayam, 2 kaki", "Sama banyak", "Keduanya tidak berkaki"],
    answer: 0
  },
  {
    q: "Lengkapi pola bilangan berikut!",
    pic: "2, 4, 6, 8, ...",
    options: ["9", "10", "12", "11"],
    answer: 1
  },
  {
    q: "Ada 5 burung di pohon. Datang 2 burung lagi. Berapa jumlah burung semuanya?",
    pic: "🐦 🐦 🐦 🐦 🐦 + 🐦 🐦",
    options: ["6", "8", "7", "3"],
    answer: 2
  },
  {
    q: "Manakah yang nilainya paling besar?",
    pic: "🔎 Bandingkan angka berikut",
    options: ["6", "9", "4", "7"],
    answer: 1
  },
  {
    q: "Lengkapi pola berikut: 10, 9, 8, 7, ...",
    pic: "⬇️ Angkanya semakin kecil",
    options: ["6", "8", "5", "9"],
    answer: 0
  },
  {
    q: "Rina punya 3 boneka. Siti punya 5 boneka. Siapa yang memiliki boneka lebih banyak?",
    pic: "🧸 🧸 🧸  |  🧸 🧸 🧸 🧸 🧸",
    options: ["Rina", "Jumlahnya sama", "Tidak ada", "Siti"],
    answer: 3
  },
  {
    q: "Ada 4 kotak. Setiap kotak berisi 1 bola. Berapa jumlah bola semuanya?",
    pic: "📦 📦 📦 📦",
    options: ["3", "5", "4", "8"],
    answer: 2
  },
  {
    q: "Bentuk apa yang berbeda dari yang lain?",
    pic: "🔺 🔺 🔵 🔺",
    options: ["🔺 pertama", "🔺 kedua", "🔺 terakhir", "🔵"],
    answer: 3
  },
  {
    q: "Doni memiliki 8 kelereng. Ia mendapat 2 lagi. Berapa jumlah kelereng Doni?",
    pic: "🔵 + 🔵 🔵",
    options: ["10", "6", "9", "12"],
    answer: 0
  },
  {
    q: "Angka berapa yang hilang?",
    pic: "3, 4, __, 6, 7",
    options: ["2", "8", "5", "9"],
    answer: 2
  },
  {
    q: "Di meja ada 6 pisang dan 2 jeruk. Buah mana yang jumlahnya lebih sedikit?",
    pic: "🍌 🍌 🍌 🍌 🍌 🍌   🍊 🍊",
    options: ["Pisang", "Jeruk", "Jumlahnya sama", "Tidak ada buah"],
    answer: 1
  },
  {
    q: "Sekarang hari Senin. Besok adalah hari ...",
    pic: "📅 Senin → ?",
    options: ["Minggu", "Jumat", "Rabu", "Selasa"],
    answer: 3
  },
  {
    q: "Lengkapi pola ini!",
    pic: "5, 10, 15, ...",
    options: ["16", "25", "20", "18"],
    answer: 2
  },
  {
    q: "Ada 9 ikan di kolam. 4 ikan berenang ke kolam lain. Berapa ikan yang tersisa?",
    pic: "🐟 🐟 🐟 🐟 🐟 🐟 🐟 🐟 🐟",
    options: ["5", "4", "6", "13"],
    answer: 0
  },
  {
    q: "Manakah yang memiliki bentuk paling berbeda?",
    pic: "⭐ ⭐ ❤️ ⭐",
    options: ["Bintang pertama", "Bintang kedua", "Bintang ketiga", "Hati ❤️"],
    answer: 3
  },
  {
    q: "Ani punya 4 pensil merah dan 3 pensil biru. Berapa jumlah pensil Ani?",
    pic: "✏️✏️✏️✏️ + 🖊️🖊️🖊️",
    options: ["6", "7", "8", "1"],
    answer: 1
  }
];

let current = 0;
let correct = 0;
let selected = null;
let playerName = "";
let answers = [];
let submitting = false;
let quizStartedAt = null;

const $ = id => document.getElementById(id);

function startQuiz() {
  playerName = $("name").value.trim();

  if (!playerName) {
    $("startError").textContent = "Tulis namamu dulu, ya! 😊";
    $("name").focus();
    return;
  }

  current = 0;
  correct = 0;
  selected = null;
  answers = [];
  submitting = false;
  quizStartedAt = new Date();

  $("start").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  renderQuestion();
}

function renderQuestion() {
  selected = null;
  const item = questions[current];

  $("number").textContent = `Soal ${current + 1} dari ${questions.length}`;
  $("points").textContent = `${correct * 5} poin`;
  $("bar").style.width = `${((current + 1) / questions.length) * 100}%`;
  $("picture").textContent = item.pic;
  $("question").textContent = item.q;
  $("hint").textContent = "Pilih satu jawaban yang benar, ya!";
  $("next").disabled = true;
  $("next").textContent =
    current === questions.length - 1 ? "Lihat Nilai 🏆" : "Lanjut ➜";

  $("choices").replaceChildren();

  item.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;

    button.onclick = () => {
      selected = index;

      document.querySelectorAll(".choice").forEach(el => {
        el.classList.remove("selected");
      });

      button.classList.add("selected");
      $("next").disabled = false;
    };

    $("choices").appendChild(button);
  });
}

async function nextQuestion() {
  if (selected === null || submitting) return;

  const item = questions[current];
  const isCorrect = selected === item.answer;

  if (isCorrect) correct++;

  answers.push({
    nomor: current + 1,
    soal: item.q,
    jawaban: item.options[selected],
    kunci: item.options[item.answer],
    hasil: isCorrect ? "Benar" : "Salah"
  });

  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    await finishQuiz();
  }
}

async function finishQuiz() {
  submitting = true;
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");

  const score = correct * 5;
  $("resultName").textContent = `Nama peserta: ${playerName}`;
  $("score").textContent = `${score}/100`;

  $("resultEmoji").textContent =
    score >= 80 ? "🏆" : score >= 50 ? "🌟" : "💪";

  $("message").textContent =
    score >= 80 ? "Wah, hebat sekali! Kamu luar biasa!" :
    score >= 50 ? "Bagus! Terus berlatih, ya!" :
    "Jangan menyerah! Yuk, belajar dan coba lagi!";

  $("detail").textContent =
    `Benar ${correct} soal dan salah ${questions.length - correct} soal.`;

  $("saveStatus").textContent = "Sedang menyimpan hasil...";
  $("retry").disabled = true;

  try {
    // Format waktu berdasarkan zona WIB.
    const waktuWIB = new Intl.DateTimeFormat("id-ID", {
      timeZone: "Asia/Jakarta",
      dateStyle: "medium",
      timeStyle: "medium",
      hour12: false
    }).format(new Date());

    const durasiDetik = Math.round(
      (Date.now() - quizStartedAt.getTime()) / 1000
    );

    const formData = new FormData();
    formData.append("Waktu Kuis (WIB)", waktuWIB);
    formData.append("Nama", playerName);
    formData.append("Nilai", String(score));
    formData.append("Jumlah benar", String(correct));
    formData.append("Jumlah salah", String(questions.length - correct));
    formData.append("Durasi (detik)", String(durasiDetik));
    formData.append("Detail jawaban", JSON.stringify(answers, null, 2));
    formData.append("_subject", "Hasil Kuis Logika Matematika - " + playerName);

    const response = await fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: formData
    });

    if (!response.ok) {
      throw new Error("Pengiriman gagal: HTTP " + response.status);
    }

    $("saveStatus").textContent = "✅ Hasil berhasil dikirim!";
  } catch (error) {
    console.error(error);
    $("saveStatus").textContent =
      "⚠️ Hasil belum berhasil dikirim. Periksa koneksi internet lalu coba lagi.";
  }

  $("retry").disabled = false;
  submitting = false;
}

function restart() {
  if (submitting) return;

  $("result").classList.add("hidden");
  $("start").classList.remove("hidden");
  $("name").value = playerName;
  $("startError").textContent = "";
}
</script>

</body>
</html>
